name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: pip install pillow
      - run: npm ci
      - run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: App icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#050507' --iconBackgroundColorDark '#050507' --splashBackgroundColor '#050507' --splashBackgroundColorDark '#050507'
      - name: Sync web build
        run: npx cap sync android
      - name: Version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Stable signing key (so updates install over the old version)
        run: mkdir -p ~/.android && cp android-keystore/chroma-debug.keystore ~/.android/debug.keystore
      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Chroma-1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: Chroma-apk, path: 'Chroma-*.apk' }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chroma 1.0.${{ github.run_number }}
          body: |
            Android app, fully offline. Download the .apk on your phone, open it and allow "Install unknown apps" for your browser or file manager when asked.
            Web version: https://designpraiseeric.github.io/chroma-encyclopedia/
          files: Chroma-*.apk
          make_latest: true
